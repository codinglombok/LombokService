[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokservice"
version = "0.1.0"
description = "Render service definitions for systemd, launchd, Windows (sc.exe) and OpenWrt procd from one specification, with exact quoting and escaping per target. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokservice"]
